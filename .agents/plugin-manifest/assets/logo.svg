<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Outline with 10% margin -->
  <polygon points="64,16 112,38 112,78 64,112 16,78 16,38"
           fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Code Brackets left & right -->
  <path d="M 44,46 L 32,64 L 44,82"
        fill="none" stroke="#e0e7ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 84,46 L 96,64 L 84,82"
        fill="none" stroke="#e0e7ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Governance Nexus Diamond / Node -->
  <polygon points="64,48 76,64 64,80 52,64"
           fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Center Pin Core -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
</svg>
