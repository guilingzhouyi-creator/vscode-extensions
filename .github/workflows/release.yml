# =============================================================================
# Release — 多扩展自动发布：检测变更扩展 → 解析版本 → 打 Tag → 构建打包 → GitHub Release
# -----------------------------------------------------------------------------
# ★ 标记系统（Tag 命名规范）：
#     <扩展名>-vMAJOR.MINOR.PATCH     例：workspace-timing-v0.4.1
#   - 每个扩展独立 Tag 命名空间，互不冲突（为多扩展 monorepo 预留）
#   - 旧的全局 Tag（如 v0.3.8）保留不动，仅历史参考
#
# ★ 产物布局（与本地 scripts/package.ps1 同构）：
#     dist/<扩展名>/<扩展名>-<版本>.vsix      # 主产物
#     dist/<扩展名>/SHA256SUMS.txt            # 校验和
#   - 附加到 GitHub Release（正式产物存储）
#   - 同时上传 Actions Artifacts（保留 90 天）
#
# 触发方式（三选一）：
#   1) push 到 main 且触及某扩展目录  →  发布该扩展
#   2) push Tag <ext>-vX.Y.Z          →  发布该扩展（跳过提交信息门控）
#   3) workflow_dispatch 手动指定扩展/版本
#
# 版本解析优先级：dispatch 输入 > 提交信息前缀 ^vX.Y.Z > （Tag 推送时）Tag 本身。
#   分支推送必须满足「提交信息以 vX.Y.Z 开头」才会发布（沿用仓库
#   "vX.Y.Z — 标题 | 英文副标题" 规范），常规提交安全跳过，不会误发布。
#
# 扩展自动发现：仓库顶层含 package.json 的目录即视为一个扩展。
#   新增扩展零配置接入——建目录、放 package.json、push 即可（预留位置）。
#
# 幂等保护：目标 Tag 已存在则跳过该扩展，重复推送不重复发布。
#
# 注意：本流水线仅产出可发布产物，不自动上架 VS Code Marketplace
#       （上架需发布者 PAT，可在 release 步骤追加 vsce publish -p $VSCE_PAT）。
# =============================================================================
name: Release (auto-tag & package)

on:
  push:
    branches: [main]
    tags: ['*-v*']            # <ext>-vX.Y.Z
  workflow_dispatch:
    inputs:
      extension:
        description: '扩展目录名（留空 = 自动检测变更的扩展）'
        required: false
        type: string
      version:
        description: '版本号（不带 v 前缀，如 0.4.1；留空 = 从提交信息解析）'
        required: false
        type: string

permissions:
  contents: write   # 推送 Tag 与创建 GitHub Release

env:
  RELEASE_BRANCH: main

jobs:
  release:
    name: Detect, tag, build & publish
    runs-on: ubuntu-latest
    steps:
      # ─── 1) 检出（完整历史，供打 Tag / 变更检测）───
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─── 2) 检测目标扩展（多扩展预留核心逻辑）───
      - name: Detect target extensions
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          TAG_REF="${{ github.ref }}"

          # 仓库顶层所有扩展目录（含 package.json 即为扩展，自动预留未来扩展）
          ALL_EXTS=$(find . -maxdepth 2 -name package.json -not -path '*/node_modules/*' \
                      -printf '%h\n' | sed 's|^\./||' | sort -u)
          echo "Discovered extensions: ${ALL_EXTS:-<none>}"

          TARGETS=""
          if [[ "$EVENT" == "push" && "$TAG_REF" == refs/tags/*-v* ]]; then
            # ── Tag 推送：扩展名 = Tag 去掉 -vX.Y.Z 后缀 ──
            TAG="${TAG_REF#refs/tags/}"
            EXT="${TAG%-v[0-9]*}"
            if echo "$ALL_EXTS" | grep -qx "$EXT"; then
              TARGETS="$EXT"
            else
              echo "::error::Tag $TAG 的扩展目录 '$EXT' 不存在或无 package.json"
              exit 1
            fi
          elif [[ -n "${{ github.event.inputs.extension }}" ]]; then
            # ── 手动指定 ──
            EXT="${{ github.event.inputs.extension }}"
            if echo "$ALL_EXTS" | grep -qx "$EXT"; then
              TARGETS="$EXT"
            else
              echo "::error::指定的扩展 '$EXT' 不存在（可用: $ALL_EXTS）"
              exit 1
            fi
          else
            # ── 分支推送：本次变更触及的扩展目录 ──
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "$GITHUB_SHA")
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || true)
            echo "Changed files (vs $BEFORE):"
            echo "$CHANGED" | head -50
            for EXT in $ALL_EXTS; do
              if echo "$CHANGED" | grep -q "^${EXT}/"; then
                TARGETS="$TARGETS $EXT"
              fi
            done
          fi

          # 规范化为多行列表
          TARGETS=$(echo "$TARGETS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
          if [[ -z "$TARGETS" ]]; then
            echo "::notice::本次变更未触及任何扩展目录 → 跳过发布。"
          fi
          {
            echo "targets<<EOF"
            echo "$TARGETS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ─── 3) 构建环境 ───
      - name: Setup Node.js
        if: steps.detect.outputs.targets != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # ─── 4) 逐扩展：解析版本 → 门控 → 打 Tag → 构建 → Release ───
      - name: Release each extension
        if: steps.detect.outputs.targets != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          MSG="${{ github.event.head_commit.message }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          IS_TAG_PUSH=false
          [[ "${{ github.ref }}" == refs/tags/*-v* ]] && IS_TAG_PUSH=true

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for EXT in ${{ steps.detect.outputs.targets }}; do
            echo ""
            echo "═══════════════ Release: $EXT ═══════════════"

            # ── 4.1 解析版本 ──
            VERSION=""
            if $IS_TAG_PUSH; then
              VERSION="${GITHUB_REF#refs/tags/$EXT-v}"
            elif [[ -n "$INPUT_VERSION" ]]; then
              VERSION="${INPUT_VERSION#v}"
            elif [[ "$MSG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
            fi
            if [[ -z "$VERSION" ]]; then
              echo "::notice::[$EXT] 提交信息未以 vX.Y.Z 开头且无手动版本 → 跳过。"
              continue
            fi

            # ── 4.2 版本一致性校验（package.json 为准，仅警告不阻断）──
            PKG_VER=$(node -p "require('./$EXT/package.json').version")
            if [[ "$PKG_VER" != "$VERSION" ]]; then
              echo "::warning::[$EXT] 解析版本 v$VERSION 与 package.json 的 $PKG_VER 不一致，产物将按 v$VERSION 命名。"
            fi

            # ── 4.3 幂等：远端 Tag 已存在则跳过 ──
            TAG="$EXT-v$VERSION"
            if git ls-remote --tags --exit-code origin "$TAG" >/dev/null 2>&1; then
              echo "::warning::[$EXT] Tag $TAG 已存在 → 跳过（防重复发布）。"
              continue
            fi

            # ── 4.4 构建（输出到统一 dist/<ext>/ 布局）──
            mkdir -p "dist/$EXT"
            ( cd "$EXT"
              npm ci
              npm run compile
              npx --yes @vscode/vsce package -o "../dist/$EXT/$EXT-$VERSION.vsix"
            )
            VSIX="dist/$EXT/$EXT-$VERSION.vsix"
            test -f "$VSIX" || { echo "::error::[$EXT] 产物缺失: $VSIX"; exit 1; }

            # SHA256 校验和
            HASH=$(sha256sum "$VSIX" | awk '{print $1}')
            echo "$HASH  $(basename "$VSIX")" > "dist/$EXT/SHA256SUMS.txt"

            # ── 4.5 发布说明：优先提取 CHANGELOG 对应版本段落 ──
            NOTES="Automated release **$TAG** for \`$EXT\`.

            - Built from: \`${GITHUB_SHA}\`
            - Artifact: \`$(basename "$VSIX")\` (SHA256: \`$HASH\`)"
            if [[ -f "$EXT/CHANGELOG.md" ]]; then
              SECTION=$(awk -v ver="$VERSION" '
                $0 ~ "^## \\["ver"\\]" {flag=1; next}
                /^## \[/ {flag=0}
                flag {print}
              ' "$EXT/CHANGELOG.md" || true)
              if [[ -n "$SECTION" ]]; then
                NOTES="$SECTION"
              fi
            fi

            # ── 4.6 打 Tag（构建成功后才打，失败不留死 Tag）──
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"

            # ── 4.7 创建 GitHub Release（附加 VSIX + 校验和）──
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              "$VSIX" "dist/$EXT/SHA256SUMS.txt"

            echo "✔ [$EXT] $TAG 发布完成"
          done

      # ─── 5) 上传产物到 Actions Artifacts（保留 90 天）───
      - name: Upload artifacts
        if: steps.detect.outputs.targets != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90
          if-no-files-found: ignore
