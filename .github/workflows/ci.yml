# =============================================================================
# CI — 构建校验流水线（仅校验，永不打 Tag / 永不发布）
# -----------------------------------------------------------------------------
# 触发：任意分支 push 或 PR，只要改动触及扩展目录（自动发现，见下）。
# 校验链：npm ci → compile → 单元测试 → lint → vsce 打包验证。
# 设计要点：本流水线不解析版本、不创建 Tag、不创建 Release，
#           「常规提交」只过一道构建检查，绝不会误触发发布。
#
# 多扩展预留：顶层含 package.json 的目录自动纳入校验（与 release.yml
#             同一套发现逻辑）。push 仅校验变更触及的扩展；PR 全量校验。
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.gitignore'
      - 'dist/**'
      - 'archive/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build & test (${{ matrix.ext }})
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix:
        ext: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.ext }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Review (L0~L5 Strict Quality Gates)
        run: |
          if jq -e '.scripts["review:strict"]' package.json >/dev/null 2>&1; then
            if [ ! -f "../auto-refactor/dist/index.js" ]; then
              (cd ../auto-refactor && npm ci --no-audit --no-fund --silent && npm run build)
            fi
            npm run review:strict
          elif jq -e '.scripts.review' package.json >/dev/null 2>&1; then
            npm run review
          else
            echo "::notice::No review script in package.json, skipping."
          fi

      - name: Verify display assets (pre-package)
        run: bash ../scripts/sh/check-display-assets.sh . pre

      - name: Package (verify only, not published)
        run: |
          mkdir -p "../dist/${{ matrix.ext }}"
          npx --yes @vscode/vsce package -o "../dist/${{ matrix.ext }}/"

      - name: Verify display assets (post-package)
        run: |
          VSIX=$(ls ../dist/${{ matrix.ext }}/*.vsix 2>/dev/null | head -1)
          bash ../scripts/sh/check-display-assets.sh . post "$VSIX"

      - name: Upload package artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.ext }}
          path: dist/${{ matrix.ext }}/
          retention-days: 7
          if-no-files-found: ignore

  # ─── 扩展发现：顶层含 package.json 的目录 → matrix ───
  discover:
    name: Discover extensions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 变更检测需要与 before SHA 做 diff

      - name: Detect changed extensions
        id: set
        shell: bash
        run: |
          set -euo pipefail
          # 仓库顶层所有扩展目录（通过单源解析器发现含 package.json 且声明 engines.vscode 的目录）
          ALL_EXTS=$(node scripts/common/project-registry-resolver.js --vscode-extensions)
          echo "Discovered extensions: ${ALL_EXTS:-<none>}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR：全量校验所有扩展
            MATRIX=$(node scripts/common/project-registry-resolver.js --vscode-extensions --matrix-json)
          else
            # push：仅校验变更触及的扩展
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "$GITHUB_SHA")
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || true)
            FILTERED=""
            for EXT in $ALL_EXTS; do
              if echo "$CHANGED" | grep -q "^${EXT}/"; then
                FILTERED="$FILTERED $EXT"
              fi
            done
            FILTERED=$(echo "$FILTERED" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            if [[ -z "$FILTERED" ]]; then
              MATRIX="[]"
            else
              MATRIX=$(echo "$FILTERED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi

          if [[ "$MATRIX" == "[]" ]]; then
            echo "::notice::无变更触及扩展目录 → CI 空跑跳过。"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ─── 仓库卫生与脚本系统自检（独立于扩展矩阵；scripts/ 与 .github/ 变更即触发）───
  # 回归守卫：P1（打包脚本根路径失效）/ P2（icon 资产校验静默禁用）/
  # P3（version-bump 工具缺失或行为漂移）在本作业中永久看守，杜绝复发。
  hygiene:
    name: Repo hygiene (scripts & packaging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 区间复核需要完整的合并目标历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            auto-refactor/package-lock.json
            WebGames/scripts/js/package-lock.json

      - name: Script line endings & encoding
        run: |
          set -euo pipefail
          # .gitattributes 声明 *.sh 一律 LF；防工具回写 CRLF 后被 text 属性掩盖为"干净"而静默失效
          SH_DIRS="scripts WebGames/scripts fractal-git/scripts auto-refactor/scripts"
          BAD_CRLF=""
          for d in $SH_DIRS; do
            [ -d "$d" ] || continue
            FOUND=$(grep -rl $'\r' "$d" --include='*.sh' 2>/dev/null || true)
            if [ -n "$FOUND" ]; then BAD_CRLF="${BAD_CRLF}${FOUND}"$'\n'; fi
          done
          if [[ -n "$BAD_CRLF" ]]; then
            echo "::error::以下 sh 脚本含 CRLF（.gitattributes 要求 LF）:"
            printf '%s' "$BAD_CRLF"
            exit 1
          fi
          BAD_BOM=""
          for d in $SH_DIRS; do
            [ -d "$d" ] || continue
            FOUND=$(grep -rl $'^\xEF\xBB\xBF' "$d" --include='*.sh' --include='*.ps1' 2>/dev/null || true)
            if [ -n "$FOUND" ]; then BAD_BOM="${BAD_BOM}${FOUND}"$'\n'; fi
          done
          if [[ -n "$BAD_BOM" ]]; then
            echo "::error::以下脚本含 UTF-8 BOM:"
            printf '%s' "$BAD_BOM"
            exit 1
          fi
          BAD_WS=$(grep -rn '[[:blank:]]$' scripts/sh scripts/ps1 2>/dev/null || true)
          if [[ -n "$BAD_WS" ]]; then
            echo "::error::以下脚本存在尾随空白:"
            echo "$BAD_WS"
            exit 1
          fi


      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in scripts/sh/*.sh; do bash -n "$f"; done

      - name: Install TypeScript for AST slice gate
        run: npm ci --prefix auto-refactor --legacy-peer-deps --ignore-scripts

      - name: Changed-set gate equivalent (pre-commit parity)
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "$GITHUB_SHA")
          fi
          FILES=$(git diff --name-only "$BASE" "$GITHUB_SHA" | grep -E '\.(ts|tsx|js|mjs|cjs|ps1|sh|py|gd|rs|json|md)$' || true)
          if [[ -z "$FILES" ]]; then
            echo "::notice::No changed files for staged-hygiene equivalence."
            exit 0
          fi
          node scripts/common/gate-fast-staged.js --range "$BASE..$GITHUB_SHA" $FILES
          node scripts/common/validate-staged-slice.js $FILES

      - name: package.sh discovery self-test
        run: |
          set -euo pipefail
          # 零网络：以不存在的扩展名触发"未找到"分支，验证根路径解析与扩展发现机制
          OUT=$(bash scripts/sh/package.sh --name __nonexistent__ 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q 'workspace-timing' || { echo "::error::package.sh 扩展发现失效（根路径解析回归）"; exit 1; }
          echo "$OUT" | grep -q '__nonexistent__' || { echo "::error::package.sh 未命中未找到分支"; exit 1; }

      - name: check-display-assets icon validation self-test
        run: |
          set -euo pipefail
          # icon 必须真实参与校验（此前 require 缺 ./ 前缀被静默吞掉）
          OUT=$(bash scripts/sh/check-display-assets.sh workspace-timing pre 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q 'images/icon.png' || { echo "::error::icon 资产未参与校验（回归）"; exit 1; }
          echo "$OUT" | grep -q 'images/banner.png' || { echo "::error::banner 资产未参与校验"; exit 1; }

      - name: version-bump.sh fixture self-test
        run: |
          set -euo pipefail
          export FIX=$(mktemp -d)
          trap 'rm -rf "$FIX"' EXIT
          node -e '
            const fs = require("fs");
            const d = process.env.FIX;
            fs.mkdirSync(d + "/demo-ext", { recursive: true });
            fs.writeFileSync(d + "/demo-ext/package.json",
              JSON.stringify({ name: "demo-ext", version: "1.2.3", engines: { vscode: "^1.85.0" } }, null, 4));
            fs.writeFileSync(d + "/demo-ext/CHANGELOG.md",
              "# Changelog\n\n## [Unreleased]\n\n### Added\n- 新功能条目\n\n## [1.2.3] — 2026-09-01\n");
          '
          # ① patch 递增 + Unreleased 内容迁移
          bash scripts/sh/version-bump.sh demo-ext patch --root "$FIX" >/dev/null
          node -e "const v=require(process.env.FIX + '/demo-ext/package.json').version; if (v !== '1.2.4') { console.error('version=' + v); process.exit(1); }"
          grep -q '## \[1.2.4\]' "$FIX/demo-ext/CHANGELOG.md" || { echo "::error::新版本段落未生成"; exit 1; }
          grep -q '新功能条目' "$FIX/demo-ext/CHANGELOG.md" || { echo "::error::Unreleased 内容未迁移"; exit 1; }
          # ② 显式版本 + 单调门禁（回退必须被拦截）
          bash scripts/sh/version-bump.sh demo-ext 1.2.5 --root "$FIX" >/dev/null
          node -e "const v=require(process.env.FIX + '/demo-ext/package.json').version; if (v !== '1.2.5') { console.error('version=' + v); process.exit(1); }"
          if bash scripts/sh/version-bump.sh demo-ext 1.2.4 --root "$FIX" >/dev/null 2>&1; then
            echo "::error::版本回退未被拦截"; exit 1
          fi
          # ③ 非法模式 → exit 2
          STATUS=0
          bash scripts/sh/version-bump.sh demo-ext banana --root "$FIX" >/dev/null 2>&1 || STATUS=$?
          if [[ $STATUS -ne 2 ]]; then echo "::error::非法模式应 exit 2 (got $STATUS)"; exit 1; fi
          # ④ 非扩展目录拒绝
          node -e '
            const fs = require("fs");
            const d = process.env.FIX;
            fs.mkdirSync(d + "/not-ext", { recursive: true });
            fs.writeFileSync(d + "/not-ext/package.json",
              JSON.stringify({ name: "not-ext", version: "0.1.0" }));
          '
          if bash scripts/sh/version-bump.sh not-ext patch --root "$FIX" >/dev/null 2>&1; then
            echo "::error::非扩展目录未被拒绝"; exit 1
          fi
          echo "✔ version-bump.sh 夹具自检全部通过"

      - name: release-tag.sh fixture self-test (dry-run gates)
        run: |
          set -euo pipefail
          export FIX=$(mktemp -d)
          trap 'rm -rf "$FIX"' EXIT
          mkdir -p "$FIX/scripts/sh" "$FIX/scripts/common" "$FIX/demo-ext"
          cp scripts/sh/release-tag.sh scripts/sh/version-bump.sh scripts/sh/check-display-assets.sh "$FIX/scripts/sh/"
          cp scripts/common/project-registry-resolver.js scripts/common/workspace-walker.js "$FIX/scripts/common/"
          FIX_DIR="$FIX" node -e '
            const fs = require("fs");
            const d = process.env.FIX_DIR;
            fs.writeFileSync(d + "/demo-ext/package.json",
              JSON.stringify({ name: "demo-ext", version: "1.2.3", engines: { vscode: "^1.85.0" } }, null, 4));
            fs.writeFileSync(d + "/demo-ext/CHANGELOG.md",
              "# Changelog\n\n## [Unreleased]\n\n### Engineering Infrastructure（工程基础设施）\n- 测试条目\n\n## [1.2.3] — 2026-09-01\n");
          '
          cd "$FIX"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add -A
          git commit -qm "init"
          # ① 干净树 dry-run：bare 前缀通过
          bash scripts/sh/release-tag.sh demo-ext patch --message "v1.2.4 — Test | Test" --dry-run >/dev/null
          # ② conventional 前缀通过
          bash scripts/sh/release-tag.sh demo-ext patch --message "feat(demo-ext): v1.2.4 - Test" --dry-run >/dev/null
          # ③ 无版本前缀 → exit 2
          bash scripts/sh/release-tag.sh demo-ext patch --message "no-version-here" --dry-run >/dev/null 2>&1 && { echo "::error::非法信息未拦截"; exit 1; }
          # ④ 版本回退 → exit 1
          bash scripts/sh/release-tag.sh demo-ext patch --message "v1.2.3 — 回退" --dry-run >/dev/null 2>&1 && { echo "::error::版本回退未拦截"; exit 1; }
          # ⑤ Tag 幂等 → exit 1
          git tag demo-ext-v1.2.4
          bash scripts/sh/release-tag.sh demo-ext patch --message "v1.2.4 — Test | Test" --dry-run >/dev/null 2>&1 && { echo "::error::Tag 幂等未拦截"; exit 1; }
          git tag -d demo-ext-v1.2.4 >/dev/null
          # ⑥ 脏树 → exit 1
          echo "dirty" > dirty.txt
          bash scripts/sh/release-tag.sh demo-ext patch --message "v1.2.4 — Test | Test" --dry-run >/dev/null 2>&1 && { echo "::error::脏树门禁未拦截"; exit 1; }
          # ⑦ 无 CHANGELOG → exit 1
          rm -f dirty.txt
          mkdir -p no-cl
          FIX_DIR="$PWD" node -e '
            const fs = require("fs");
            fs.writeFileSync(process.env.FIX_DIR + "/no-cl/package.json",
              JSON.stringify({ name: "no-cl", version: "0.1.0", engines: { vscode: "^1.85.0" } }));
          '
          bash scripts/sh/release-tag.sh no-cl patch --message "v0.2.0 — X | Y" --dry-run >/dev/null 2>&1 && { echo "::error::缺 CHANGELOG 未拦截"; exit 1; }
          echo "✔ release-tag.sh 夹具自检全部通过"

      - name: Prove hook carrier self-heal from a clean checkout
        run: |
          set -euo pipefail
          # 模拟全新检出：本地 hooksPath 未配置，安装器必须自行修复并回读断言
          git config --unset core.hooksPath || true
          node scripts/common/install-hooks.js
          node scripts/common/install-hooks.js --check

      - name: Hooks & Receipts self-test
        run: |
          set -euo pipefail
          REFS_TEMP=$(mktemp)
          trap 'rm -f "$REFS_TEMP"' EXIT
          # 1. install-hooks.sh 激活自检
          bash scripts/sh/install-hooks.sh
          # 1.1 提交树可执行位断言：全新克隆必须保留 100755
          HOOK_MODES=$(git ls-tree -r HEAD .githooks/ | cut -d' ' -f1 | sort -u)
          test "$HOOK_MODES" = "100755" || { echo "::error::.githooks 提交树模式异常: $HOOK_MODES"; exit 1; }
          # 1.2 六类载体存在性、语法与索引模式自检
          for hook in pre-commit commit-msg pre-merge-commit post-commit post-merge pre-push; do
            test -f ".githooks/$hook" || { echo "::error::缺少钩子载体 .githooks/$hook"; exit 1; }
            bash -n ".githooks/$hook"
            MODE=$(git ls-files -s ".githooks/$hook" | cut -d' ' -f1)
            test "$MODE" = "100755" || { echo "::error::.githooks/$hook 索引模式异常: $MODE"; exit 1; }
          done
          # 1.3 门禁收据引擎自测（阶段合并 / 缺失收据阻断 / 基线豁免 / 显式放行留痕 / 引用安全）
          node scripts/common/gate-receipts.js selftest
          # 1.4 多 ref 推送引用安全：受保护删除必须阻断，特性分支删除必须放行
          HEAD_SHA=$(git rev-parse HEAD)
          printf "refs/heads/main %s refs/heads/main %s\n" "$HEAD_SHA" "$HEAD_SHA" > "$REFS_TEMP"
          node scripts/common/gate-receipts.js verify-refs --refs-file "$REFS_TEMP"
          printf "(delete) %040d refs/heads/feature/ci-probe %s\n" 0 "$HEAD_SHA" >> "$REFS_TEMP"
          node scripts/common/gate-receipts.js verify-refs --refs-file "$REFS_TEMP"
          printf "(delete) %040d refs/heads/main %s\n" 0 "$HEAD_SHA" >> "$REFS_TEMP"
          if node scripts/common/gate-receipts.js verify-refs --refs-file "$REFS_TEMP" >/dev/null 2>&1; then
            echo "::error::受保护分支删除未被拦截"; exit 1
          fi
          # 2. pre-commit-gate.sh 自检 (无暂存应 exit 0)
          bash scripts/sh/pre-commit-gate.sh

      - name: Commit-msg gate self-test
        run: |
          set -euo pipefail
          MERGE_MSG_TEMP=$(mktemp)
          MSG_TEMP=$(mktemp)
          trap 'rm -f .git/MERGE_HEAD "$MERGE_MSG_TEMP" "$MSG_TEMP"' EXIT
          # 1.5 合并提交结构性豁免：MERGE_HEAD 存在且标题为 Git 生成的合并格式时放行
          printf "Merge branch 'ci/probe'\n\nmerge probe\n" > "$MERGE_MSG_TEMP"
          git rev-parse HEAD > .git/MERGE_HEAD
          bash scripts/sh/commit-msg-gate.sh "$MERGE_MSG_TEMP"
          rm -f .git/MERGE_HEAD "$MERGE_MSG_TEMP"
          # 3. commit-msg-gate.sh 生产工程级结构化合规自检
          printf "%s\n" \
            "feat(ci): 引入生产工程级提交信息门禁" \
            "" \
            "[Project / 项目归属]" \
            "- governance" \
            "" \
            "[Why / 动机背景]" \
            "- 规范全仓 Git 提交信息格式，杜绝敷衍低密度提交。" \
            "" \
            "[Added / 新增内容]" \
            "- 新增结构化正文区块校验与字数底线检测。" \
            "" \
            "[Verification / 验证结论]" \
            "- 本地与 CI 自动化自测通过。" > "$MSG_TEMP"
          bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP"
          # 4. commit-msg-gate.sh 非法信息阻断自检 (非法应 exit 1)
          echo "bad message" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截非法提交信息"; exit 1
          fi
          echo "wip: 临时改动" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截 wip 黑话信息"; exit 1
          fi
          # 5. feat 缺少正文阻断自检
          echo "feat(ci): 只有标题没有正文" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截缺少正文的 feat 提交"; exit 1
          fi
          # PROJECT-SCOPE-06 (CMG-PRJ-001) 项目归属格式区自检
          # 5.1.1 缺少项目归属格式区应 exit 1
          printf "%s\n" \
            "feat(ci): 缺少项目归属格式区" \
            "" \
            "[Why / 动机背景]" \
            "- 测试项目归属缺失拦截能力。" \
            "" \
            "[Added / 新增内容]" \
            "- 验证拦截逻辑生效。" \
            "" \
            "[Verification / 验证结论]" \
            "- CI 自动化自测。" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截缺少项目归属的 feat 提交"; exit 1
          fi
          # 5.1.2 填入非法项目名称应 exit 1
          printf "%s\n" \
            "feat(ci): 填入非法项目名称" \
            "" \
            "[Project / 项目归属]: invalid-project-name" \
            "" \
            "[Why / 动机背景]" \
            "- 测试非法项目名称拦截能力。" \
            "" \
            "[Added / 新增内容]" \
            "- 验证拦截逻辑生效。" \
            "" \
            "[Verification / 验证结论]" \
            "- CI 自动化自测。" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截非法项目名称"; exit 1
          fi
          # RULE-TRUTH-08 (CMG-STY-002) 规则标识反虚构自检：未登记 ID 必须阻断
          printf "%s\n" \
            "feat(ci): 测试虚构规则拦截" \
            "" \
            "[Project / 项目归属]" \
            "- governance" \
            "" \
            "[Why]" \
            "- 验证未知规则 ID 拦截能力。" \
            "" \
            "[Added]" \
            "- 新增 fake rule FAKE-XYZ-999。" \
            "" \
            "[Verification]" \
            "- CI 自检测试。" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截虚构规则 ID"; exit 1
          fi
          # TEXT-TRUTH-09 (CMG-STY-002) 风格与文本约束自检
          node scripts/common/validate-commit-msg-style.js --test
          # 7.1 验证风格元叙事口号拦截 (CAT-04)
          printf "%s\n" \
            "docs(readme): 调整整体文案语调为低调中肯、求真务实，移除宣扬性词汇" \
            "" \
            "[Why]" \
            "- 规范文档风格。" \
            "" \
            "[Changed]" \
            "- 调整整体文案语调为低调中肯、求真务实，移除宣扬性词汇。" \
            "" \
            "[Verification]" \
            "- CI 自检。" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截风格元叙事口号"; exit 1
          fi
          # 7.2 验证过度肯定绝对化词汇拦截 (CAT-02)
          printf "%s\n" \
            "feat(ci): 彻底完美解决所有崩溃" \
            "" \
            "[Project / 项目归属]" \
            "- governance" \
            "" \
            "[Why]" \
            "- 打造工业级架构。" \
            "" \
            "[Added]" \
            "- 新增模块。" \
            "" \
            "[Verification]" \
            "- CI 自检。" > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截过度肯定绝对化词汇"; exit 1
          fi
          # 7.3 验证合法复合技术术语白名单放行
          printf "%s\n" \
            "fix(path): 修复跨平台文件查找未能转换为绝对路径的问题" \
            "" \
            "[Project / 项目归属]" \
            "- governance" \
            "" \
            "[Why]" \
            "- 生成的临时文件需支持绝对路径计算。" \
            "" \
            "[Fixed]" \
            "- 修复绝对路径解析函数。" \
            "" \
            "[Verification]" \
            "- 单元测试通过。" > "$MSG_TEMP"
          bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP"
          # 7.4 验证英文风格元叙事口号拦截 (CAT-04 English Bypass)
          printf "%s\n" \
            "docs(readme): tone down wording to be humble and pragmatic" \
            "" \
            "[Why]" \
            "- Update documentation wording." \
            "" \
            "[Changed]" \
            "- Tone down wording to be humble and pragmatic." \
            "" \
            "[Verification]" \
            "- CI self-test." > "$MSG_TEMP"
          if bash scripts/sh/commit-msg-gate.sh "$MSG_TEMP" >/dev/null 2>&1; then
            echo "::error::commit-msg-gate 未拦截英文风格元叙事口号"; exit 1
          fi

      - name: Workspace Governance & SSOT guards
        run: |
          set -euo pipefail
          # 8. Pillar-2 单源规则目录、文档一致性、门禁词表与破坏性操作守卫（有界并发调度 23 项）
          node scripts/common/run-workspace-guards.js --group pillar2
          # 8.0 双实现行为差分与三态矩阵（独立于 Pillar-2）
          node scripts/common/test-gate-parity.js
          node scripts/common/test-gate-selftest.js
          node scripts/common/validate-gate-verdicts.js
          # 8.1 平台级物理卫生、同构脚本、.gitignore、代码密度与双轨体积
          node scripts/common/validate-physical-hygiene.js
          node scripts/common/validate-script-isomorphism.js
          node scripts/common/validate-gitignore-governance.js
          node scripts/common/validate-code-density.js --all
          node scripts/common/evaluate-eloc-budget.js --all
          # 9. 平台级 AST 切片审查自检
          node scripts/common/validate-staged-slice.js scripts/common/validate-staged-slice.js

      - name: WebGames config, Mermaid & Trajectory
        run: |
          set -euo pipefail
          # 10. 长期轨迹账本物理约束自检
          node scripts/common/validate-trajectory-ledger.js
          # 11. WebGames 配置架构与规范审查
          python3 WebGames/scripts/py/audit_config.py --strict
          # 11.1 WebGames 文档 Mermaid 真解析（audit_docs 的字符启发式发现不了语法破损）
          npm ci --prefix WebGames/scripts/js --no-audit --no-fund --silent
          node WebGames/scripts/js/validate-mermaid.mjs
          # 12. 工作区统一轨迹记录与边界自检
          node scripts/common/record-workspace-trajectory.js
          node scripts/common/validate-trajectory-ledger.js
          echo "✔ Git 本地门禁脚本与审查联动自检全部通过"

      - name: Commit message gate for the pushed range
        run: |
          set -euo pipefail
          # PR 用 base sha，push 用 before sha；新建分支的 before 为全零时回退到合并目标
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=origin/main
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=origin/main
          fi
          node scripts/common/validate-push-range-messages.js --range "$BASE..HEAD"

      - name: Render workspace quality dashboard to Step Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            node -e '
              const fs = require("fs");
              const p = "auto-refactor/reports/self-audit-baseline.json";
              let compositeScore = "N/A";
              let grade = "";
              let totalDebt = "N/A";
              let autonomyRate = "";
              let tenDims = null;

              try {
                if (fs.existsSync(p)) {
                  const b = JSON.parse(fs.readFileSync(p, "utf8"));
                  const m = b.metrics || {};
                  compositeScore = m.compositeScore ?? b.compositeScore ?? "N/A";
                  grade = m.grade ? ` (Grade: **${m.grade}**)` : "";
                  totalDebt = m.totalIssues ?? m.unsuppressedIssues ?? "N/A";
                  if (b.autonomyRate || m.autonomyRate || b.cai) {
                    autonomyRate = ` &nbsp;|&nbsp; **自研率**: **${b.autonomyRate || m.autonomyRate || b.cai}%**`;
                  }
                  tenDims = b.tenDimensions || null;
                }
              } catch (_) {}

              const jobStatus = process.env.JOB_STATUS || "unknown";
              let md = "## 🌐 全工作区跨项目统一审查与十维质量看板\n\n";
              md += "### 📊 本作业实际执行结果\n\n";
              md += "| 作业 | 判定 |\n| :--- | :---: |\n";
              md += `| Repo hygiene (scripts & packaging) | ${jobStatus === "success" ? "🟢 达标" : "🔴 阻断 (" + jobStatus.toUpperCase() + ")"} |\n\n`;
              md += "> 本看板仅反映 hygiene 作业内实际执行的检查。扩展构建与 auto-refactor 门禁由独立作业承担，未执行项不再标注为达标。\n\n";

              md += "### 🎯 全工作区十维工程质量看板（冻结基线参考快照：`auto-refactor/reports/self-audit-baseline.json`）\n\n";
              if (tenDims) {
                md += `> **综合健康分**: **${compositeScore}**${grade} &nbsp;|&nbsp; **技术债总量**: **${totalDebt} 项**${autonomyRate}\n\n`;
                md += "| 序号 | 质量维度 | 得分 | 进度可视化 |\n";
                md += "| :---: | :--- | :---: | :--- |\n";
                const dims = JSON.parse(fs.readFileSync("scripts/common/ten-dimensions-contract.json", "utf8")).dimensions.map((d) => ({
                  num: String(d.num),
                  name: `${d.zhName} (${d.enName})`,
                  key: d.key
                }));
                for (const d of dims) {
                  const score = Number(tenDims[d.key] ?? 0);
                  const filled = Math.max(0, Math.min(20, Math.round((score / 100) * 20)));
                  const empty = 20 - filled;
                  const bar = "█".repeat(filled) + "░".repeat(empty);
                  const scoreStr = score % 1 === 0 ? score.toFixed(1) : String(Math.round(score * 100) / 100);
                  md += `| ${d.num} | ${d.name} | ${scoreStr} | \`[${bar}]\` |\n`;
                }
              } else {
                md += "> ⚠️ [离线基线快照未就绪 - 优雅降级模式]\n";
              }
              md += "\n";
              try {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md, "utf8");
              } catch (_) {}
            '
          fi

  # ─── auto-refactor 工具门禁（与扩展矩阵解耦；仅改动 auto-refactor/ 时执行）───
  # 该目录不是 VS Code 扩展（无 engines.vscode），故不参与上方扩展矩阵。
  # 四道防线：Prettier 格式 → ESLint 结构/JSDoc → 自举 strict 注释棘轮 → 全量验证套件。
  auto-refactor:
    name: auto-refactor gate (format/lint/comments/tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 变更检测需要与 before SHA 做 diff

      - name: Detect auto-refactor changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # PR：全量执行；push：仅当变更触及 auto-refactor/ 时执行
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "$GITHUB_SHA")
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(auto-refactor/|scripts/|\.agents/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::auto-refactor/ 与共享治理脚本均无变更 → 门禁空跑跳过。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: auto-refactor/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: auto-refactor
        run: npm ci --legacy-peer-deps

      - name: Setup Rust toolchain
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: auto-refactor/crates

      - name: Build native addon
        if: steps.scope.outputs.run == 'true'
        working-directory: auto-refactor
        run: npm run build:native

      - name: Gate (format + lint + strict comments + full test suite)
        if: steps.scope.outputs.run == 'true'
        working-directory: auto-refactor
        run: npm run gate

  # ─── fractal-git 核心引擎门禁（Rust 10大微 Crate 回归套件）───
  fractal-git:
    name: fractal-git gate (check/tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect fractal-git changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "$GITHUB_SHA")
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(fractal-git/|scripts/|\.agents/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::fractal-git/ 与共享治理脚本均无变更 → 门禁空跑跳过。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            fractal-git/package-lock.json
            auto-refactor/package-lock.json

      - name: Install Node dependencies (fractal-git & tsc toolchain)
        if: steps.scope.outputs.run == 'true'
        run: |
          npm ci --prefix fractal-git --no-audit --no-fund --silent
          npm ci --prefix auto-refactor --legacy-peer-deps --ignore-scripts --no-audit --no-fund --silent

      - name: Setup Rust toolchain
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fractal-git

      - name: Fractal-git architectural and zero-alloc static validation
        if: steps.scope.outputs.run == 'true'
        run: |
          node fractal-git/scripts/common/validate-crate-topology.js
          node fractal-git/scripts/common/check-zero-alloc-boundary.js
          node fractal-git/scripts/common/validate-git-parity.js --require-git
          node fractal-git/scripts/common/validate-gate-bridge.js

      - name: Cargo test (workspace)
        if: steps.scope.outputs.run == 'true'
        working-directory: fractal-git
        run: cargo test --workspace

      - name: Rustfmt check
        if: steps.scope.outputs.run == 'true'
        working-directory: fractal-git
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        if: steps.scope.outputs.run == 'true'
        working-directory: fractal-git
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Fractal-git TypeScript tests
        if: steps.scope.outputs.run == 'true'
        working-directory: fractal-git
        run: npm test

      - name: Hosted repo parity (Git vs Taxis)
        if: steps.scope.outputs.run == 'true'
        run: node fractal-git/scripts/common/run-hosted-repo-parity.js

  gate-parity-windows:
    name: Gate parity (Windows dual runtime)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate hooks through PowerShell installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/ps1/install-hooks.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install-hooks.ps1 执行失败' }
          $modes = @(git ls-files -s .githooks/ | ForEach-Object { ($_ -split '\s+')[0] })
          if ($modes.Count -ne 6) { throw "钩子载体数量异常: $($modes.Count)" }
          $bad = @($modes | Where-Object { $_ -ne '100755' })
          if ($bad.Count -gt 0) { throw ".githooks 索引模式异常: $($modes -join ',')" }

      - name: PowerShell runtime gate self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msg = Join-Path $env:RUNNER_TEMP 'gate-msg.txt'
          $good = @(
            'feat(ci): 校验 PowerShell 运行期提交信息门禁',
            '',
            '[Project / 项目归属]',
            '- governance',
            '',
            '[Why / 动机背景]',
            '- 确保双运行期门禁在 Windows 运行器上行为一致。',
            '',
            '[Added / 新增内容]',
            '- 新增运行期等价性回归任务。',
            '',
            '[Verification / 验证结论]',
            '- 本地门禁脚本自检通过。'
          ) -join "`n"
          [System.IO.File]::WriteAllText($msg, $good, (New-Object System.Text.UTF8Encoding($false)))
          pwsh -NoProfile -File scripts/ps1/commit-msg-gate.ps1 $msg
          if ($LASTEXITCODE -ne 0) { throw '合规提交信息未通过 PowerShell 门禁' }
          [System.IO.File]::WriteAllText($msg, 'bad message', (New-Object System.Text.UTF8Encoding($false)))
          pwsh -NoProfile -File scripts/ps1/commit-msg-gate.ps1 $msg
          if ($LASTEXITCODE -eq 0) { throw 'PowerShell 门禁未拦截非法提交信息' }

      - name: Dual-runtime behavioural parity
        run: node scripts/common/test-gate-parity.js --require-parity

      - name: Receipt engine self-test
        run: node scripts/common/gate-receipts.js selftest
