[workspace]
members = [
    "crates/fg-core",
    "crates/fg-object",
    "crates/fg-index",
    "crates/fg-algorithms",
    "crates/fg-pools",
    "crates/fg-native",
    "crates/fg-storage",
    "crates/fg-topology",
    "crates/fg-transport",
    "crates/fg-gate",
]
resolver = "2"

[package]
name = "fractal-git"
version = "0.1.0"
edition = "2021"
description = "Agent-native fractal git engine: lockless in-memory index, CAS snapshot materialization, and self-similar worktree reclamation."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
license = "MIT"

[lib]
# The library is consumed only by this package's own binary and its test targets, all of which link
# it as Rust. It exposes no C ABI: there is no `no_mangle` entry point, no `.node` loader, and the
# TypeScript side states outright that it ships no native binding. Keeping `cdylib` in the crate
# types therefore produced a shared object whose several tens of thousands of export ordinals had no
# reader, and every public item — the measurement harness included — was published through it.
crate-type = ["rlib"]

[dependencies]
fg-core = { path = "crates/fg-core" }
fg-object = { path = "crates/fg-object" }
fg-index = { path = "crates/fg-index" }
fg-algorithms = { path = "crates/fg-algorithms" }
fg-pools = { path = "crates/fg-pools" }
fg-native = { path = "crates/fg-native" }
fg-storage = { path = "crates/fg-storage" }
fg-topology = { path = "crates/fg-topology" }
fg-transport = { path = "crates/fg-transport" }
fg-gate = { path = "crates/fg-gate" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
sha1 = "0.10"
thiserror = "1.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.8"

# ------------------------------------------------------------------------------
# Build profiles.
#
# The workspace is ten local crates whose hot paths all cross crate boundaries:
# `Oid` codecs and hex helpers in `fg-core`, the Gear table in `fg-algorithms`,
# the fanout readers in `fg-storage`. With Cargo's defaults (`lto = false`,
# `codegen-units = 16`) none of those calls can be inlined, and the cost lands
# squarely on the per-line and per-object loops that dominate the benchmarks.
#
# `panic = "abort"` is deliberately NOT set. `fg-gate` and the CLI surface return
# typed `FractalError` values on every failure path; switching to abort would
# remove the unwind tables those contracts rely on for defence in depth, and the
# measured benefit of abort on this codebase is inside noise.
# ------------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "symbols"

# Benchmarks must be measured against the same code the release binary ships,
# otherwise a ratchet compares two different programs.
[profile.bench]
inherits = "release"

[[test]]
name = "integration_storage"
path = "tests/integration_storage.rs"

[[test]]
name = "integration_algorithms"
path = "tests/integration_algorithms.rs"

[[test]]
name = "integration_cli"
path = "tests/integration_cli.rs"

[[test]]
name = "integration_governance"
path = "tests/integration_governance.rs"

[[test]]
name = "test_e2e_clone_benchmark"
path = "tests/rust/test_e2e_clone_benchmark.rs"

[[test]]
name = "test_adversarial_projection"
path = "tests/rust/test_adversarial_projection.rs"

[[test]]
name = "test_adversarial_durability"
path = "tests/rust/test_adversarial_durability.rs"
