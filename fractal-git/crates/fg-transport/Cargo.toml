[package]
name = "fg-transport"
version = "0.1.0"
edition = "2021"
description = "Git wire protocol (pkt-line, Smart Protocol v2) and zero-copy local agent IPC for Fractal Git."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
license = "MIT"

[dependencies]
fg-core = { path = "../fg-core" }
fg-object = { path = "../fg-object" }
fg-topology = { path = "../fg-topology" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
