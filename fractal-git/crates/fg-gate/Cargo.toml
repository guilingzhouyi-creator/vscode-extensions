[package]
name = "fg-gate"
version = "0.1.0"
edition = "2021"
description = "Protocol-level quality gates, authorization hooks, and conflict hygiene guards for Fractal Git."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
license = "MIT"

[dependencies]
fg-core = { path = "../fg-core" }
fg-object = { path = "../fg-object" }
fg-topology = { path = "../fg-topology" }
auto-refactor-engine = { path = "../../../auto-refactor/crates/auto-refactor-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
oxc_syntax = "0.158.0"
syn = { version = "2.0.119", features = ["full", "visit"] }
