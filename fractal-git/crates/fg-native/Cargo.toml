[package]
name = "fg-native"
version = "0.1.0"
edition = "2021"
description = "Taxis native binary repository container (TAXC): sectioned, CRC32C-verified, mmap-friendly."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
