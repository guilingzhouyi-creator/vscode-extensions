[package]
name = "fg-core"
version = "0.1.0"
edition = "2021"
description = "Core domain types, atomic models, and trait interfaces for Fractal Git."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
license = "MIT"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
