[package]
name = "fg-storage"
version = "0.1.0"
edition = "2021"
description = "Storage engines (Loose ODB, CAS Block Backend, Crash-Safe WAL Journal, Materialization) for Fractal Git."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
license = "MIT"

[dependencies]
fg-core = { path = "../fg-core" }
fg-object = { path = "../fg-object" }
fg-index = { path = "../fg-index" }
fg-algorithms = { path = "../fg-algorithms" }
fg-pools = { path = "../fg-pools" }
fg-native = { path = "../fg-native" }
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
roaring = "0.10"

# FICLONE block cloning is a Linux-only kernel interface. Declaring libc inside the target gate
# keeps the dependency out of the Windows build graph while giving the Linux branch a crate it can
# actually name: a transitively available libc is not nameable under edition 2021, so the ioctl
# call sites would otherwise fail to resolve only on the platform that uses them.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
