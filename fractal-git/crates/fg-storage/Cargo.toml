[package]
name = "fg-storage"
version = "0.1.0"
edition = "2021"
description = "Storage engines (Loose ODB, CAS Block Backend, Crash-Safe WAL Journal, Materialization) for Fractal Git."
authors = ["Google DeepMind Advanced Agentic Coding Pair"]
license = "MIT"

[dependencies]
fg-core = { path = "../fg-core" }
fg-object = { path = "../fg-object" }
fg-index = { path = "../fg-index" }
fg-algorithms = { path = "../fg-algorithms" }
fg-pools = { path = "../fg-pools" }
flate2 = "1.0"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
