              主责切入（测试）→ 三职能自查 → 交叉审查 → 两圈收敛 → 完成即唤醒下一个 NPC，
              在 Issue 评论按【执行清单】报告。
  pull_request.comment@npc:
    default:
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
