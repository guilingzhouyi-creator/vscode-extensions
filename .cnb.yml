              动作：git diff 全面审查构建/测试改动，可定点修复他者缺陷。
              唤醒：完成即唤醒下一 NPC（确定性通道；评论 @ 仅留痕）。
              输出：【执行清单】[x]/[ ] 回显。
            userPrompt: |
